name: build

on:
  push:
    branches: [main]
    paths: [versions.env]
  pull_request:
    paths-ignore:
      - '**.md'
      - .github/dependabot.yml
      - .github/workflows/update.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Build image
        run: docker build -f docker/build.Dockerfile -t libexec-build .
      - name: Build and pack
        run: docker run --rm -v "$PWD:/work" -w /work libexec-build bash -c 'scripts/build.sh && scripts/pack.sh'
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.arch }}
          path: work/out/libexec-*.tar.gz*

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: bundle-${{ matrix.arch }}
          path: out
      - name: Allow unprivileged user namespaces and FUSE
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update && sudo apt-get install -y fuse3
      - name: Unpack and test
        run: |
          mkdir tree && tar -xzf out/libexec-*.tar.gz -C tree
          scripts/smoke.sh tree

  # Runs for a push to main and a manual run on main. The update workflow publishes by itself.
  release:
    needs: smoke
    if: github.ref == 'refs/heads/main' && inputs.ref == ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ github.sha }}
