name: update

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Look for newer releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-versions.sh

      - name: Open or update the pull request
        env:
          # A pull request opened with the default token does not start the build workflow.
          # Set the UPDATE_TOKEN secret (contents and pull requests: write) so the build runs on it.
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN || github.token }}
        run: |
          if git diff --quiet -- versions.env; then
            echo "versions.env is up to date"
            exit 0
          fi
          . ./versions.env
          branch="update/apptainer-$APPTAINER_VERSION-libfuse-$LIBFUSE_VERSION-fakeroot-$FAKEROOT_VERSION"
          title="Update tools: Apptainer $APPTAINER_VERSION, libfuse $LIBFUSE_VERSION, fakeroot $FAKEROOT_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add versions.env
          git commit -m "$title"
          git push --force origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "$title" --body-file work/pr-body.md
          else
            gh pr create --head "$branch" --base "${{ github.event.repository.default_branch }}" --title "$title" --body-file work/pr-body.md
          fi
