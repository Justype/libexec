name: update

# Weekly: when Apptainer has a new release, move versions.env to the newest releases, build and test
# that commit on both architectures, and only when everything passes put it on main and publish it.
# A new libfuse or fakeroot alone changes nothing. A failed build changes nothing on main.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      branch: ${{ steps.commit.outputs.branch }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Look for a new Apptainer release
        id: commit
        run: |
          old=$(. ./versions.env; echo "$APPTAINER_VERSION")
          scripts/update-versions.sh
          . ./versions.env
          if [ "$APPTAINER_VERSION" = "$old" ]; then
            echo "Apptainer $old is the newest release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="update/apptainer-$APPTAINER_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add versions.env
          { echo "Update to Apptainer $APPTAINER_VERSION"; echo; cat work/notes.md; } > work/message.txt
          git commit -F work/message.txt
          # The branch only carries the commit to the build jobs. It is deleted at the end.
          git push --force origin "$branch"
          {
            echo "changed=true"
            echo "branch=$branch"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.update.outputs.sha }}

  land:
    needs: [update, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update.outputs.sha }}
          fetch-depth: 0
      # A fast-forward puts the tested commit itself on main. The push is refused if main moved meanwhile.
      - name: Fast-forward main
        run: git push origin "HEAD:refs/heads/${{ github.event.repository.default_branch }}"

  release:
    needs: [update, land]
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.update.outputs.sha }}

  cleanup:
    needs: [update, release]
    if: always() && needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${{ needs.update.outputs.branch }}" || true
